# workled dsh plugin patch — inserted into the profile's bundle stack.
# The plugin source lives next to this file (./src/index.js).
- insert:
    - id: workled
      name: 'workled'
      # Config is overridden by the profile's cordis.patch.yml / env vars.
      # WORKLED_MCP_URL wins on every call; the url field is a fallback.
      config:
        url: 'http://<device-name>.local:18791/mcp'
        # How long to wait for a workled HTTP call before giving up (ms).
        timeout: 1500
        # Set to false to disable the plugin at boot without uninstalling.
        enabled: true
